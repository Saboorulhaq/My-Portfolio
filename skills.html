<!doctype html>

    <title>Skills | Saboor Ulhaq</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      try {
        var t =
          localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme:dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>

    <header>
      <div class="wrap bar">
        <a class="logo" href="index.html">S.</a>

          <a href="contact.html">Contact</a>

        </nav>
      </div>
    </header>

    <main class="wrap page page-in">
      <h2>Skills</h2>
      <div class="skillgroup">
        <h3>Languages</h3>
        <div class="chips">
          <span>HTML</span><span>JavaScript</span><span>TypeScript</span
          ><span>Python</span><span>SQL</span>
        </div>

      <div class="skillgroup">

      <div class="skillgroup">

      </div>
    </main>

    <footer>
      <div class="wrap">© 2026 Saboor Ulhaq. Lahore, Pakistan.</div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
